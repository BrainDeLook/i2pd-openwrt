name: Test i2pd package ABI

on:
  pull_request:
    paths:
      - i2pd/**
      - .github/scripts/**
      - .github/workflows/**
  push:
    branches:
      - codex/**
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Existing run artifact to retest without recompiling (same package sources only)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check build scripts
        run: |
          bash -n .github/scripts/*.sh
          shellcheck .github/scripts/*.sh

  aarch64:
    name: Build aarch64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: inputs.build_run_id == ''
    outputs:
      boost_version: ${{ steps.sdk_feed.outputs.boost_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare current stable dependency feed
        id: sdk_feed
        run: bash .github/scripts/prepare-sdk-feed.sh

      - name: Build package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_generic-25.12.5
          FEEDNAME: action
          FEED_DIR: ${{ steps.sdk_feed.outputs.feed_dir }}
          PACKAGES: i2pd
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          BUILD_LOG: 1
          V: s

      - name: Upload package and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i2pd-aarch64-test
          path: |
            bin/packages/**/action/i2pd-*.apk
            logs
          if-no-files-found: warn

  smoke:
    name: Install and run with official OpenWrt dependencies
    needs: aarch64
    if: always() && (needs.aarch64.result == 'success' || (needs.aarch64.result == 'skipped' && inputs.build_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: i2pd-aarch64-test
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Check linked Boost ABI
        env:
          BUILT_BOOST_VERSION: ${{ needs.aarch64.outputs.boost_version }}
        run: |
          set -euo pipefail
          apk="$(find bin -type f -name 'i2pd-*.apk' -print -quit)"
          test -n "$apk"
          boost_version="$BUILT_BOOST_VERSION"
          if [ -z "$boost_version" ]; then
            recipe="$(curl -fsSL https://raw.githubusercontent.com/openwrt/packages/openwrt-25.12/libs/boost/Makefile)"
            boost_version="$(sed -n 's/^PKG_VERSION:=//p' <<< "$recipe")"
          fi
          test -n "$boost_version"
          bash .github/scripts/verify-boost-abi.sh "$apk" "$boost_version"

      - name: Run with official OpenWrt runtime libraries
        run: |
          set -euo pipefail
          apk="$(find bin -type f -name 'i2pd-*.apk' -print -quit)"
          # CI needs no repository secret: use a throwaway key to exercise the
          # same signed index and relative APK download path as production.
          private_key="$RUNNER_TEMP/i2pd-test.pem"
          public_key="$RUNNER_TEMP/i2pd-test.pub.pem"
          openssl ecparam -name prime256v1 -genkey -noout -out "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          bash .github/scripts/collect-feed.sh "$apk" test-feed "$private_key" "$public_key"
          version="$(sed -n 's/^PKG_VERSION:=//p' i2pd/Makefile)"
          release="$(sed -n 's/^PKG_RELEASE:=//p' i2pd/Makefile)"
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$(realpath test-feed):/packages:ro" \
            -e "I2PD_VERSION=${version}-r${release}" \
            ghcr.io/openwrt/rootfs:aarch64_generic-25.12.5 \
            -ec 'mkdir -p /var/lock; cp /packages/i2pd-feed.pub.pem /etc/apk/keys/i2pd-test.pem; apk -X /packages/packages.adb update; apk -X /packages/packages.adb add "i2pd=$I2PD_VERSION"; /usr/bin/i2pd --version'

      - name: Upload signed test repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i2pd-test-feed
          path: test-feed
          if-no-files-found: warn
