name: Test i2pd package ABI

on:
  pull_request:
    paths:
      - i2pd/**
      - .github/scripts/**
      - .github/workflows/**
  push:
    branches:
      - codex/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check build scripts
        run: |
          bash -n .github/scripts/*.sh
          shellcheck .github/scripts/*.sh

  aarch64:
    name: Build and run aarch64 with official dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare current stable dependency feed
        id: sdk_feed
        run: bash .github/scripts/prepare-sdk-feed.sh

      - name: Build package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_generic-25.12.5
          FEEDNAME: action
          FEED_DIR: ${{ steps.sdk_feed.outputs.feed_dir }}
          PACKAGES: i2pd
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          BUILD_LOG: 1
          V: s

      - name: Check linked Boost ABI
        run: |
          set -euo pipefail
          apk="$(find bin -type f -name 'i2pd-*.apk' -print -quit)"
          test -n "$apk"
          bash .github/scripts/verify-boost-abi.sh "$apk" '${{ steps.sdk_feed.outputs.boost_version }}'

      - name: Run with official OpenWrt runtime libraries
        run: |
          set -euo pipefail
          apk="$(find bin -type f -name 'i2pd-*.apk' -print -quit)"
          # CI needs no repository secret: use a throwaway key to exercise the
          # same signed index and relative APK download path as production.
          private_key="$RUNNER_TEMP/i2pd-test.pem"
          public_key="$RUNNER_TEMP/i2pd-test.pub.pem"
          openssl ecparam -name prime256v1 -genkey -noout -out "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          bash .github/scripts/collect-feed.sh "$apk" test-feed "$private_key" "$public_key"
          version="$(sed -n 's/^PKG_VERSION:=//p' i2pd/Makefile)"
          release="$(sed -n 's/^PKG_RELEASE:=//p' i2pd/Makefile)"
          docker run --rm --platform linux/arm64 \
            --entrypoint /bin/sh \
            -v "$(realpath test-feed):/packages:ro" \
            -e "I2PD_VERSION=${version}-r${release}" \
            ghcr.io/openwrt/rootfs:aarch64_generic-25.12.5 \
            -ec 'mkdir -p /var/lock; cp /packages/i2pd-feed.pub.pem /etc/apk/keys/i2pd-test.pem; apk -X /packages/packages.adb update; apk -X /packages/packages.adb add "i2pd=$I2PD_VERSION"; /usr/bin/i2pd --version'

      - name: Upload package and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i2pd-aarch64-test
          path: |
            bin/packages/**/action/i2pd-*.apk
            test-feed
            logs
          if-no-files-found: warn
